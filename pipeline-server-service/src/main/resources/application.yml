# 流水线执行状态同步配置（默认值，各环境可在对应 profile 中覆盖）
pipeline:
  run:
    sync:
      # 异步轮询 Argo 的间隔（秒）
      sync-interval-seconds: 5
      # 兜底同步的陈旧阈值（秒）：update_time 距今超过该值才允许兜底追赶
      staleness-threshold-seconds: 60
      # 单条记录异步轮询最大尝试次数（防死循环安全帽）
      max-sync-attempts: 720

